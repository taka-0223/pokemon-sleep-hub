<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokémon Sleep Decision Hub</title><meta name="theme-color" content="#0e1116"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"></head><body>
<header class="topbar"><div><div class="eyebrow">POKÉMON SLEEP / CURRENT</div><h1>育成意思決定 Hub</h1></div><div id="revision" class="revision"></div></header>
<main class="shell"><nav class="tabs"><button class="tab active" data-view="home">ホーム</button><button class="tab" data-view="roster">手持ち</button><button class="tab" data-view="roles">役割</button></nav>
<section id="home" class="view active"><div id="kpis" class="kpi-grid"></div><div class="section-head"><div><span class="eyebrow">NEXT ACTION</span><h2>いま見るべき個体</h2></div></div><div id="focusList" class="card-list"></div><div class="section-head"><div><span class="eyebrow">ROLE GAPS</span><h2>役割の穴</h2></div></div><div id="gapList" class="role-grid"></div></section>
<section id="roster" class="view"><div class="controls"><input id="search" type="search" placeholder="ポケモン名・役割で検索"><select id="qualityFilter"><option value="">全品質</option><option>S</option><option>A+</option><option>A</option><option>B</option><option>C</option><option>特殊</option></select><select id="typeFilter"><option value="">全役割</option><option>きのみ</option><option>食材</option><option>スキル</option></select></div><div id="rosterList" class="card-list"></div></section>
<section id="roles" class="view"><div class="section-head"><div><span class="eyebrow">ACCOUNT MAP</span><h2>役割スロット</h2></div></div><div id="roleList" class="role-grid"></div></section></main>
<dialog id="detailDialog"><button id="closeDialog" class="close">×</button><div id="detail"></div></dialog><script src="./data.js"></script><script src="./app.js"></script></body></html>
