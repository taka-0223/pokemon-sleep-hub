name: Validate PWA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source
        run: |
          python3 -m py_compile scripts/build_srp.py scripts/build_data.py
          node --check app.js
          node --check data.js
          node --check srp.js
          node --check updates.js
          node --check data-gate.js
          node --check data-gate-ui.js
          node --test tests/data-gate.test.cjs
          grep -q '"status":"ready"' srp.js

      - name: Verify SRP generator
        run: |
          python3 scripts/build_srp.py /tmp/srp.js
          node --check /tmp/srp.js
          grep -q '"status":"ready"' /tmp/srp.js
