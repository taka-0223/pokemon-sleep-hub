name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Rebuild v0.3 PWA
        run: |
          rm -rf _site site-v0.3.zip
          mkdir -p _site
          cat site-v03-parts/*.b64 | tr -d '\n\r ' | base64 -d > site-v0.3.zip
          unzip -tq site-v0.3.zip
          unzip -q site-v0.3.zip -d _site

      - name: Fetch simulator source
        run: |
          git clone --depth=1 https://github.com/reimer0204/pokesle-simulator.git vendor/pokesle-simulator

      - name: Generate Species Role Percentile
        run: |
          python _site/scripts/generate-srp.py vendor/pokesle-simulator _site/srp.js
          test -s _site/srp.js
          head -c 120 _site/srp.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
