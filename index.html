<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Sleep Decision Hub</title>
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">POKÉMON SLEEP / CURRENT</div><h1>育成意思決定 Hub</h1></div>
  <div id="revision" class="revision"></div>
</header>

<main id="swipeArea" class="shell">
  <section id="home" class="view active">
    <div class="page-title"><div><span class="eyebrow">ACCOUNT OVERVIEW</span><h2>現状</h2></div></div>
    <div id="kpis" class="kpi-grid"></div>
    <div id="statusSummary" class="status-summary"></div>
    <div class="section-head"><div><span class="eyebrow">COVERAGE</span><h2>役割の充足</h2></div></div>
    <div id="coverage" class="coverage-stack"></div>
    <div class="section-head"><div><span class="eyebrow">CORE ROSTER</span><h2>主な手持ち</h2></div></div>
    <div id="coreRoster" class="dense-list"></div>
  </section>

  <section id="roster" class="view">
    <div class="page-title"><div><span class="eyebrow">ROSTER</span><h2>手持ち一覧</h2></div></div>
    <div class="controls">
      <input id="search" type="search" placeholder="名前・役割で検索">
      <select id="qualityFilter"><option value="">全品質</option><option>S</option><option>A+</option><option>A</option><option>B</option><option>C</option><option>特殊</option></select>
      <select id="typeFilter"><option value="">全役割</option><option>きのみ</option><option>食材</option><option>スキル</option></select>
    </div>
    <div id="rosterList" class="dense-list"></div>
  </section>

  <section id="refine" class="view">
    <div class="page-title"><div><span class="eyebrow">REFINEMENT</span><h2>厳選状況</h2></div></div>
    <p class="lede">全役割を厳選状態で表示。厳選中を上に、完了済みを下に並べ、各項目で候補種まで確認できます。</p>
    <div id="refineList" class="compact-list"></div>
  </section>

  <section id="roles" class="view">
    <div class="page-title"><div><span class="eyebrow">ROLE MAP</span><h2>役割一覧</h2></div></div>
    <div id="roleList" class="compact-list"></div>
  </section>

  <section id="plan" class="view">
    <div class="page-title"><div><span class="eyebrow">CONTEXT</span><h2>育成・イベント</h2></div></div>
    <div id="resourceBar" class="resource-bar"></div>
    <div class="section-head"><div><span class="eyebrow">EVENTS</span><h2>イベント情報</h2></div></div>
    <div id="eventList" class="event-grid"></div>
    <div class="section-head"><div><span class="eyebrow">TRAINING</span><h2>育成中</h2></div></div>
    <div id="planList" class="dense-list"></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="主要ナビゲーション">
  <button class="nav-item active" data-view="home"><span>◫</span><small>現状</small></button>
  <button class="nav-item" data-view="roster"><span>▤</span><small>手持ち</small></button>
  <button class="nav-item" data-view="refine"><span>◎</span><small>厳選</small></button>
  <button class="nav-item" data-view="roles"><span>◇</span><small>役割</small></button>
  <button class="nav-item" data-view="plan"><span>△</span><small>育成</small></button>
</nav>

<dialog id="detailDialog"><button id="closeDialog" class="close" aria-label="閉じる">×</button><div id="detail"></div></dialog>
<script src="./data.js"></script>
<script src="./srp.js"></script>
<script src="./app.js"></script>
</body>
</html>
