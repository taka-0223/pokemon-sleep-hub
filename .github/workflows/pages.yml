name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Rebuild v0.3 PWA package
        run: |
          rm -rf _site rebuilt-site.zip
          mkdir -p _site
          cat site-v03-parts/*.b64 | tr -d '\n\r ' | base64 -d > rebuilt-site.zip
          unzip -tq rebuilt-site.zip
          unzip -q rebuilt-site.zip -d _site
          grep -q '2026-10-02-r9' _site/data.js

      - name: Generate Species Role Percentiles
        run: |
          git clone --depth 1 https://github.com/reimer0204/pokesle-simulator.git /tmp/pokesle-simulator
          python3 _site/scripts/generate-srp.py /tmp/pokesle-simulator _site/srp.js
          grep -q 'SRP-v0.1' _site/srp.js
          grep -q 'デンリュウ' _site/srp.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
