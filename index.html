<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Sleep Decision Hub</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a2530" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest?v=0.15">
<link rel="stylesheet" href="./style.css?v=0.15">
</head>
<body>
<header class="topbar">
  <div class="brand-lockup">
    <span class="brand-moon" aria-hidden="true">
      <svg viewBox="0 0 32 32"><path d="M22.7 4.9a11.8 11.8 0 1 0 4.4 18.2A10.4 10.4 0 0 1 22.7 4.9Z"/><path d="M23.6 8.2l.9 1.8 2 .3-1.5 1.4.4 2-1.8-.9-1.8.9.4-2-1.5-1.4 2-.3.9-1.8Z"/></svg>
    </span>
    <div><div class="eyebrow">POKÉMON SLEEP · CURRENT</div><h1>育成意思決定 Hub</h1></div>
  </div>
  <div id="revision" class="revision"></div>
</header>

<main id="swipeArea" class="shell">
  <section id="home" class="view active">
    <div class="page-title"><div><span class="eyebrow">ACCOUNT OVERVIEW</span><h2>現状</h2></div></div>
    <div id="kpis" class="kpi-grid"></div>
    <div id="statusSummary" class="status-summary"></div>
    <div class="section-head"><div><span class="eyebrow">COVERAGE</span><h2>役割の充足</h2></div></div>
    <div id="coverage" class="coverage-stack"></div>
    <div class="section-head"><div><span class="eyebrow">CORE ROSTER</span><h2>主な手持ち</h2></div></div>
    <div id="coreRoster" class="dense-list"></div>
  </section>

  <section id="roster" class="view">
    <div class="page-title"><div><span class="eyebrow">ROSTER</span><h2>手持ち一覧</h2></div></div>
    <div class="controls">
      <input id="search" type="search" placeholder="名前・役割で検索">
      <select id="qualityFilter"><option value="">全品質</option><option>S</option><option>A+</option><option>A</option><option>B</option><option>C</option><option>特殊</option></select>
      <select id="typeFilter"><option value="">全役割</option><option>きのみ</option><option>食材</option><option>スキル</option></select>
    </div>
    <div id="rosterList" class="dense-list"></div>
  </section>

  <section id="refine" class="view">
    <div class="page-title"><div><span class="eyebrow">REFINEMENT</span><h2>厳選状況</h2></div></div>
    <p class="lede">全役割を厳選状態で表示。厳選中を上に、完了済みを下に並べ、各項目で候補種まで確認できます。</p>
    <div id="refineList" class="compact-list"></div>
  </section>

  <section id="roles" class="view">
    <div class="page-title"><div><span class="eyebrow">ROLE MAP</span><h2>役割一覧</h2></div></div>
    <div id="roleList" class="compact-list"></div>
  </section>

  <section id="plan" class="view">
    <div class="page-title"><div><span class="eyebrow">CONTEXT</span><h2>育成・イベント</h2></div></div>
    <div id="resourceBar" class="resource-bar"></div>
    <div class="section-head"><div><span class="eyebrow">EVENTS</span><h2>イベント情報</h2></div></div>
    <div id="eventList" class="event-grid"></div>
    <div class="section-head"><div><span class="eyebrow">TRAINING</span><h2>育成中</h2></div></div>
    <div id="planList" class="dense-list"></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="主要ナビゲーション">
  <button class="nav-item active" data-view="home">
    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.8 3.8a7.2 7.2 0 1 0 4.4 12.7A6.4 6.4 0 0 1 15.8 3.8Z"/><path d="M17.8 6.2l.6 1.2 1.4.2-1 1 .2 1.3-1.2-.6-1.2.6.2-1.3-1-1 1.4-.2.6-1.2Z"/></svg></span>
    <small>現状</small>
  </button>
  <button class="nav-item" data-view="roster">
    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="6" cy="17" r="1.7"/><path d="M10 7h7.5M10 12h7.5M10 17h7.5"/></svg></span>
    <small>手持ち</small>
  </button>
  <button class="nav-item" data-view="refine">
    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.2"/><path d="m14.4 14.4 4.2 4.2"/><path d="m18.1 5.1.6 1.3 1.4.2-1 1 .3 1.4-1.3-.7-1.3.7.3-1.4-1-1 1.4-.2.6-1.3Z"/></svg></span>
    <small>厳選</small>
  </button>
  <button class="nav-item" data-view="roles">
    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="7" r="2.4"/><circle cx="7" cy="17" r="2.4"/><circle cx="17" cy="17" r="2.4"/><path d="M9.4 7h5.2M7 9.4v5.2M17 9.4v5.2M9.4 17h5.2"/></svg></span>
    <small>役割</small>
  </button>
  <button class="nav-item" data-view="plan">
    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20v-8"/><path d="M12 14c-4 0-6.2-2.1-6.2-5.4 3.9-.2 6.2 1.7 6.2 5.4Z"/><path d="M12 11.6c3.7 0 6-2 6-5.1-3.7-.2-6 1.6-6 5.1Z"/><path d="m9.5 20 2.5-2.5 2.5 2.5"/></svg></span>
    <small>育成</small>
  </button>
</nav>

<dialog id="detailDialog"><button id="closeDialog" class="close" aria-label="閉じる">×</button><div id="detail"></div></dialog>
<script src="./data.js?v=0.15"></script>
<script src="./srp.js?v=0.15"></script>
<script src="./app.js?v=0.15"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const hadController = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("./service-worker.js?v=0.15", { updateViaCache: "none" });
      await reg.update();
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !refreshing) {
          refreshing = true;
          location.reload();
        }
      });
    } catch (e) {
      console.warn("Service worker registration failed", e);
    }
  });
}
</script>
</body>
</html>
